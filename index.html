    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #080808;
            --card-bg: #141414;
            --card-hover: #1f1f1f;
            --primary: #ff6600;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: radial-gradient(circle at center, #1c0c00 0%, var(--bg-color) 80%);
        }

        .wrapper {
            width: 100%;
            max-width: 480px;
            text-align: center;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border: 3px solid var(--primary);
            border-radius: 50%;
            padding: 3px;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.3);
            overflow: hidden;
            background-color: #000;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .profile-title {
            font-size: 1rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .profile-bio {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 35px;
            line-height: 1.6;
            padding: 0 10px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px 22px;
            border-radius: 14px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        /* تنسيق الأيقونة لتكون على اليسار */
        .link-card svg {
            width: 24px;
            height: 24px;
            fill: var(--primary);
            flex-shrink: 0;
            order: 1; /* توجيه الأيقونة لليسار */
        }

        /* تنسيق النص ليكون بالمنتصف/اليمين المتناسق */
        .link-card span {
            flex-grow: 1;
            text-align: right;
            padding-right: 10px;
            order: 2;
        }

        .link-card:hover {
            background-color: var(--card-hover);
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 102, 0, 0.2);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media (max-width: 500px) {
            .profile-avatar { width: 100px; height: 100px; }
            .profile-name { font-size: 1.6rem; }
        }
    </style>
</head>
